<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise 1 CSS grid/flexbox</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Healthy Living Market</h1>
      <h2>Be intentional with your diet!</h2>
      <br>

    </header>
    <main>
      <div class="card_container">
        <div class="card">
          <img src="https://s3.amazonaws.com/shecodesio-production/uploads/files/000/180/004/original/ChatGPT_Image_May_10__2026__04_56_44_PM.png?1778425179" alt="Breakfast Hampper" />
          <h4>Breakfast Energy Hamper</h4>
          <p>R75</p>
          <button>Add to Cart</button>
        </div>
        

        <div class="card">
          <img src="https://s3.amazonaws.com/shecodesio-production/uploads/files/000/180/003/original/ChatGPT_Image_May_10__2026__04_57_32_PM.png?1778425141" alt="Protein Hamper"  />
          <h4>Protein Power Hamper</h4>
          <p>R150</p>
          <button>Add to Cart</button>
        </div>
        

        <div class="card">
          <img src="https://s3.amazonaws.com/shecodesio-production/uploads/files/000/180/009/original/image_3fe4ed79_%281%29.png?1778427543" alt="Healthy Fats Hamper" />
          <h4>Healthy Fats Hamper</h4>
          <p>R180</p>
          <button>Add to Cart</button>
        </div>
        

        <div class="card">
          <img src="https://s3.amazonaws.com/shecodesio-production/uploads/files/000/180/006/original/image_87e76b2a.png?1778425599" alt="immunity boost Hamper"  />
          <h4>Immunity Boost Hamper</h4>
          <p>R300</p>
          <button>Add to Cart</button>
        </div>
        

        <div class="card">
          <img src="https://s3.amazonaws.com/shecodesio-production/uploads/files/000/180/007/original/image_15b79d26_%281%29.png?1778425687" alt="Green Detox Hamper"  />
          <h4>Green Detox Hamper</h4>
          <p>R370</p>
          <button>Add to Cart</button>
        </div>
        

        <div class="card">
          <img src="https://s3.amazonaws.com/shecodesio-production/uploads/files/000/180/008/original/image_e6143944.png?1778425871" alt="Calcium Care Hamper"  />
          <h4>Calcium Care Hamper</h4>
          <p>R250</p>
          <button>Add to Cart</button>
        </div>
        
        
      </div>
      
    </main>
  </body>
</html>
